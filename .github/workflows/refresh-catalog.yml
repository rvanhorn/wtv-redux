name: Refresh bundled catalog

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run catalog:refresh
      - run: pnpm run check
      - name: Commit the refreshed catalog
        run: |
          if git diff --quiet -- src/data/catalog.json; then
            echo "The bundled catalog is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/catalog.json
          git commit -m 'chore(catalog): refresh the bundled series catalog' \
            -m 'The scheduled refresh rebuilt src/data/catalog.json from the public Warhammer TV JSON routes.'
          git push
